<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1c2e;--mu:#6b6e85;--acc:#4f46e5;--bd:#e4e6f2;--ok:#16a34a;--wa:#f59e0b;--er:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12121c;--card:#1d1e2e;--tx:#eceefa;--mu:#9a9db8;--acc:#818cf8;--bd:#2d2f45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12121c;--card:#1d1e2e;--tx:#eceefa;--mu:#9a9db8;--acc:#818cf8;--bd:#2d2f45;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:150px}
main{max-width:560px;margin:0 auto;padding:12px}
.hd{background:var(--acc);color:#fff;border-radius:20px;padding:16px;margin-bottom:12px}
.hd .nav{display:flex;align-items:center;justify-content:space-between}
.hd button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;width:38px;height:38px;font-size:18px}
.hd .big{font-size:32px;font-weight:700;margin:6px 0}
.hd .row{display:flex;gap:16px;font-size:14px;opacity:.95}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 10px;font-size:16px}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
.ic{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.it .m{flex:1;min-width:0}.it small{color:var(--mu)}
.dh{font-size:12px;color:var(--mu);padding-top:10px;font-weight:600}
.r{color:var(--ok)}.d{color:var(--er)}.mu{color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:6px}
input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:600;width:100%}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.btn.x{background:none;color:var(--er)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;padding:6px}
.tabs button b{display:block;font-size:20px;font-weight:400}
.tabs .on{color:var(--acc);font-weight:600}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;border:0;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:5}
.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.seg{display:flex;gap:8px;margin-bottom:10px}.seg button{flex:1}
.pk{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pk button{font-size:22px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;width:42px;height:42px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.res{font-size:22px;font-weight:700;color:var(--acc)}
.emp{text-align:center;color:var(--mu);padding:18px 0}
.er{color:var(--er);font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Novo movimento">+</button>
<nav class="tabs" id="tabs"></nav>
<div class="ov" id="ov"><div class="sh" id="sh"></div></div>
<script>
var CP=["🛒","🏠","🚗","🎉","💊","🛍️","📚","🍽️","✈️","💼","💰","🎁"];
var COL=["#4f46e5","#06b6d4","#f59e0b","#ec4899","#10b981","#8b5cf6","#ef4444"];
var MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var S={tx:[],cats:[]},tab="mov",ed=null,ec=null,dr={},dc={},cb=null,now=new Date();
var cur=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
function load(){try{var j=localStorage.getItem("orc2");if(j){var o=JSON.parse(j);S={tx:o.tx||[],cats:o.cats||[]}}}catch(e){}}
function save(){try{localStorage.setItem("orc2",JSON.stringify(S))}catch(e){}}
function eur(n){return n.toLocaleString("pt-PT",{style:"currency",currency:"EUR"})}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(i){return document.getElementById(i)}
function uid(){return"i"+Date.now().toString(36)+Math.floor(Math.random()*1e5)}
function today(){return(new Date(now.getTime()-now.getTimezoneOffset()*60000)).toISOString().slice(0,10)}
function shift(k,n){var p=k.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function lab(k){var p=k.split("-");return MES[+p[1]-1]+" "+p[0]}
function mt(k){return S.tx.filter(function(t){return t.d.slice(0,7)===k})}
function sum(a,t){return a.filter(function(x){return x.t===t}).reduce(function(s,x){return s+x.v},0)}
function bycat(k){var o={};mt(k).filter(function(t){return t.t==="d"}).forEach(function(t){o[t.c]=(o[t.c]||0)+t.v});return o}
function cat(id){return S.cats.filter(function(c){return c.id===id})[0]||{n:"Sem categoria",e:"📦",t:"d"}}
function wipe(){return S.tx.length||S.cats.length?'<button class="btn x" onclick="wipeQ()">Apagar todos os dados</button>':""}

function head(){var a=mt(cur),r=sum(a,"r"),d=sum(a,"d");
return '<div class="hd"><div class="nav"><button onclick="go(-1)">‹</button><b style="text-transform:capitalize">'+lab(cur)+'</b><button onclick="go(1)">›</button></div><div class="big">'+eur(r-d)+'</div><div class="row"><span>Receitas '+eur(r)+'</span><span>Despesas '+eur(d)+'</span></div></div>'}
function go(n){cur=shift(cur,n);render()}

function vMov(){
if(!S.cats.length)return '<div class="card emp"><b>Bem-vindo!</b><br>Começa por criar as tuas categorias, por exemplo Alimentação ou Salário.<br><br><button class="btn" onclick="tab=\'cat\';render()">Criar categorias</button><button class="btn s" style="margin-top:8px" onclick="demo()">Carregar dados de exemplo</button></div>';
var a=mt(cur).sort(function(x,y){return y.d.localeCompare(x.d)});
if(!a.length)return '<div class="card emp">Sem movimentos neste mês.<br>Toca em + para adicionar.</div>'+wipe();
var ld="";
return '<div class="card"><h3>Movimentos</h3>'+a.map(function(t){var c=cat(t.c),hd=t.d!==ld?'<div class="dh">'+t.d.slice(8)+'/'+t.d.slice(5,7)+'</div>':"";ld=t.d;
return hd+'<div class="it" onclick="openF(\''+t.id+'\')"><div class="ic">'+c.e+'</div><div class="m"><div>'+esc(t.n||c.n)+'</div><small>'+(t.n?esc(c.n):(t.t==="d"?"Despesa":"Receita"))+'</small></div><b class="'+(t.t==="d"?"d":"r")+'">'+(t.t==="d"?"−":"+")+eur(t.v)+'</b></div>'}).join("")+'</div>'+wipe()}

function row(c,g){var v=g[c.id]||0,L=c.l||0,p=L?v/L*100:0,col=p>100?"var(--er)":p>=80?"var(--wa)":"var(--ok)";
var x='<div class="it" style="padding:8px 0;border:0" onclick="openC(\''+c.id+'\')"><div class="ic">'+c.e+'</div><div class="m">'+esc(c.n)+(c.t==="d"?'<br><small>'+eur(v)+(L?' / '+eur(L):' · sem limite')+'</small>':'')+'</div><span class="mu">›</span></div>';
if(c.t==="d"&&L)x+='<div class="bar"><i style="width:'+Math.min(p,100)+'%;background:'+col+'"></i></div>'+(p>100?'<small class="d">Limite ultrapassado em '+eur(v-L)+'</small>':p>=80?'<small style="color:var(--wa)">Atenção: já usaste '+Math.round(p)+'%</small>':'');
return '<div style="margin-bottom:8px">'+x+'</div>'}
function vCat(){var g=bycat(cur),h="";
[["d","Despesas","despesa"],["r","Receitas","receita"]].forEach(function(T){var L=S.cats.filter(function(c){return c.t===T[0]});
h+='<div class="card"><h3>'+T[1]+(T[0]==="d"?' e limites do mês':'')+'</h3>'+(L.length?L.map(function(c){return row(c,g)}).join(""):'<div class="mu" style="font-size:14px;margin-bottom:8px">Ainda não tens categorias de '+T[2]+'.</div>')+'<button class="btn s" onclick="openC(null,\''+T[0]+'\')">+ Nova categoria de '+T[2]+'</button></div>'});
return h+wipe()}

function vGra(){var g=bycat(cur),ks=Object.keys(g).sort(function(a,b){return g[b]-g[a]}),tot=ks.reduce(function(s,k){return s+g[k]},0),h='<div class="card"><h3>Despesas por categoria</h3>';
if(!tot)h+='<div class="emp">Sem despesas neste mês.</div>';
else{var off=25,arcs="";ks.forEach(function(k,i){var p=g[k]/tot*100;arcs+='<circle cx="21" cy="21" r="15.9155" fill="none" stroke="'+COL[i%7]+'" stroke-width="6" stroke-dasharray="'+p+' '+(100-p)+'" stroke-dashoffset="'+off+'"/>';off-=p});
h+='<svg viewBox="0 0 42 42" style="width:200px;display:block;margin:0 auto">'+arcs+'<text x="21" y="21.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="currentColor">'+eur(tot)+'</text></svg><div class="leg">'+ks.map(function(k,i){return '<span><i style="background:'+COL[i%7]+'"></i>'+esc(cat(k).n)+' '+Math.round(g[k]/tot*100)+'%</span>'}).join("")+'</div>'}
h+='</div>';
var ms=[],i;for(i=5;i>=0;i--)ms.push(shift(cur,-i));
var dt=ms.map(function(m){var a=mt(m);return{m:m,r:sum(a,"r"),d:sum(a,"d")}}),mx=Math.max.apply(null,dt.map(function(x){return Math.max(x.r,x.d)}).concat([1])),b="";
dt.forEach(function(x,i){var X=14+i*52,hr=x.r/mx*110,hd=x.d/mx*110;
b+='<rect x="'+X+'" y="'+(125-hr)+'" width="19" height="'+hr+'" rx="3" fill="var(--ok)"/><rect x="'+(X+21)+'" y="'+(125-hd)+'" width="19" height="'+hd+'" rx="3" fill="var(--er)"/><text x="'+(X+20)+'" y="142" text-anchor="middle" font-size="10" fill="var(--mu)">'+MES[+x.m.slice(5)-1].slice(0,3)+'</text>'});
return h+'<div class="card"><h3>Últimos 6 meses</h3><svg viewBox="0 0 330 150" style="width:100%">'+b+'</svg><div class="leg"><span><i style="background:var(--ok)"></i>Receitas</span><span><i style="background:var(--er)"></i>Despesas</span></div></div>'}

function vCal(){return '<div class="card"><h3>Regra 50/30/20</h3><label>Rendimento mensal líquido (€)</label><input id="c1" type="number" inputmode="decimal" oninput="calc()"><div id="o1" class="mu">Introduz um valor.</div></div>'+
'<div class="card"><h3>Poupança com juros</h3><label>Depósito mensal (€)</label><input id="c2" type="number" inputmode="decimal" oninput="calc()"><label>Taxa anual (%)</label><input id="c3" type="number" inputmode="decimal" oninput="calc()"><label>Anos</label><input id="c4" type="number" inputmode="decimal" oninput="calc()"><div id="o2" class="mu">Preenche os campos.</div></div>'+
'<div class="card"><h3>Prestação de empréstimo</h3><label>Montante (€)</label><input id="c5" type="number" inputmode="decimal" oninput="calc()"><label>Taxa anual (%)</label><input id="c6" type="number" inputmode="decimal" oninput="calc()"><label>Prazo (anos)</label><input id="c7" type="number" inputmode="decimal" oninput="calc()"><div id="o3" class="mu">Preenche os campos.</div></div><div class="mu" style="font-size:12px">Valores indicativos: sem seguros, comissões nem impostos. Não substituem aconselhamento financeiro.</div>'}
function calc(){var v=function(i){return parseFloat($(i).value)||0},a=v("c1");
$("o1").innerHTML=a?'Necessidades <b>'+eur(a*.5)+'</b><br>Desejos <b>'+eur(a*.3)+'</b><br>Poupança <b>'+eur(a*.2)+'</b>':"Introduz um valor.";
var p=v("c2"),r=v("c3")/1200,n=v("c4")*12;
if(p&&n){var f=r?p*(Math.pow(1+r,n)-1)/r:p*n;$("o2").innerHTML='<span class="res">'+eur(f)+'</span><br>Depositado: '+eur(p*n)+' · Juros: '+eur(f-p*n)}else $("o2").textContent="Preenche os campos.";
var M=v("c5"),q=v("c6")/1200,k=v("c7")*12;
if(M&&k){var pm=q?M*q/(1-Math.pow(1+q,-k)):M/k;$("o3").innerHTML='<span class="res">'+eur(pm)+' / mês</span><br>Total pago: '+eur(pm*k)+' · Juros: '+eur(pm*k-M)}else $("o3").textContent="Preenche os campos."}

function render(){
$("app").innerHTML=(tab==="cal"?"":head())+({mov:vMov,cat:vCat,gra:vGra,cal:vCal})[tab]();
$("fab").style.display=tab==="mov"&&S.cats.length?"block":"none";
$("tabs").innerHTML=[["mov","🧾","Movimentos"],["cat","🏷️","Categorias"],["gra","📊","Gráficos"],["cal","🧮","Calcular"]].map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render();scrollTo(0,0)"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join("")}

function show(){$("ov").classList.add("on")}
function closeF(){$("ov").classList.remove("on");ed=null;ec=null;cb=null}
function ask(m,fn){cb=fn;$("sh").innerHTML='<h3>'+m+'</h3><button class="btn" style="background:var(--er)" onclick="if(cb)cb()">Confirmar</button><button class="btn s" style="margin-top:6px" onclick="closeF()">Cancelar</button>';show()}
function demo(){var D=[["d","Alimentação","🛒",300],["d","Casa","🏠",600],["d","Transportes","🚗",120],["d","Lazer","🎉",100],["d","Saúde","💊",0],["r","Salário","💼",0],["r","Extra","💰",0]],ids={},m;
D.forEach(function(x,i){var c={id:uid()+"c"+i,t:x[0],n:x[1],e:x[2],l:x[3]};ids[x[1]]=c.id;S.cats.push(c)});
var P=[["Alimentação",5,55,"Supermercado"],["Alimentação",14,40,"Mercearia"],["Alimentação",23,65,"Compras da semana"],["Casa",2,520,"Renda"],["Casa",10,60,"Eletricidade e água"],["Transportes",8,45,"Combustível"],["Transportes",21,30,"Passe"],["Lazer",18,35,"Jantar fora"],["Lazer",26,20,"Cinema"],["Saúde",16,18,"Farmácia"]];
for(m=0;m<6;m++){var k=shift(cur,-m);
S.tx.push({id:uid()+"r"+m,t:"r",v:1450,c:ids["Salário"],d:k+"-01",n:"Ordenado"});
if(m%2===0)S.tx.push({id:uid()+"e"+m,t:"r",v:Math.round(80+Math.random()*120),c:ids["Extra"],d:k+"-15",n:"Trabalho extra"});
P.forEach(function(p,j){S.tx.push({id:uid()+"d"+m+"_"+j,t:"d",v:Math.round(p[2]*(0.75+Math.random()*0.5)*100)/100,c:ids[p[0]],d:k+"-"+String(p[1]).padStart(2,"0"),n:p[3]})})}
save();render()}
function wipeQ(){ask("Apagar TODOS os movimentos e categorias? Não dá para desfazer.",function(){S={tx:[],cats:[]};save();closeF();render()})}

function openF(id){ed=id?S.tx.filter(function(t){return t.id===id})[0]:null;
dr=ed?Object.assign({},ed):{t:"d",v:"",c:"",d:cur===today().slice(0,7)?today():cur+"-01",n:""};form();show()}
function seg(a,f){return '<div class="seg"><button class="btn '+(a==="d"?"":"s")+'" onclick="'+f+'(\'d\')">Despesa</button><button class="btn '+(a==="r"?"":"s")+'" onclick="'+f+'(\'r\')">Receita</button></div>'}
function form(){var t=dr,cs=S.cats.filter(function(c){return c.t===t.t}),k=t.t==="d"?"despesa":"receita";
if(!cs.length){$("sh").innerHTML='<h3>'+(ed?"Editar movimento":"Novo movimento")+'</h3>'+seg(t.t,"sw")+'<div class="emp">Ainda não tens categorias de '+k+'.</div><button class="btn" onclick="newCat()">Criar categoria de '+k+'</button><button class="btn s" style="margin-top:6px" onclick="closeF()">Cancelar</button>';return}
$("sh").innerHTML='<h3>'+(ed?"Editar movimento":"Novo movimento")+'</h3>'+seg(t.t,"sw")+'<label>Valor (€)</label><input id="fv" type="number" inputmode="decimal" step="0.01" value="'+esc(t.v)+'"><label>Categoria</label><select id="fc">'+cs.map(function(c){return '<option value="'+c.id+'"'+(c.id===t.c?" selected":"")+'>'+c.e+' '+esc(c.n)+'</option>'}).join("")+'</select><label>Data</label><input id="fd" type="date" value="'+t.d+'"><label>Nota (opcional)</label><input id="fn" value="'+esc(t.n)+'"><div id="er" class="er"></div><button class="btn" onclick="saveF()">Guardar</button>'+(ed?'<button class="btn x" onclick="delF()">Apagar</button>':'')+'<button class="btn s" style="margin-top:6px" onclick="closeF()">Cancelar</button>'}
function keep(){if($("fv")){dr.v=$("fv").value;dr.c=$("fc").value;dr.d=$("fd").value;dr.n=$("fn").value}}
function sw(x){keep();dr.t=x;dr.c="";form()}
function newCat(){var t=dr.t;closeF();tab="cat";render();openC(null,t)}
function saveF(){var v=parseFloat($("fv").value),d=$("fd").value;
if(!(v>0)){$("er").textContent="Indica um valor maior que zero.";return}
if(!d){$("er").textContent="Indica a data.";return}
var o={t:dr.t,v:v,c:$("fc").value,d:d,n:$("fn").value.trim()};
if(ed)Object.assign(ed,o);else{o.id=uid();S.tx.push(o)}
cur=d.slice(0,7);save();closeF();render()}
function delF(){var t=ed;ask("Apagar este movimento?",function(){S.tx=S.tx.filter(function(x){return x!==t});save();closeF();render()})}

function openC(id,t){ec=id?S.cats.filter(function(c){return c.id===id})[0]:null;
dc=ec?Object.assign({},ec):{t:t||"d",n:"",e:"",l:""};fc();show()}
function fc(){var t=dc;
$("sh").innerHTML='<h3>'+(ec?"Editar categoria":"Nova categoria")+'</h3>'+(ec?'':seg(t.t,"swc"))+'<label>Nome</label><input id="kn" maxlength="24" value="'+esc(t.n)+'"><label>Ícone (toca num ou escreve um emoji)</label><input id="ke" maxlength="4" value="'+esc(t.e)+'"><div class="pk">'+CP.map(function(e){return '<button onclick="$(\'ke\').value=this.textContent">'+e+'</button>'}).join("")+'</div>'+(t.t==="d"?'<label>Limite mensal (€, opcional)</label><input id="kl" type="number" inputmode="decimal" min="0" value="'+esc(t.l||"")+'">':'')+'<div id="er" class="er"></div><button class="btn" onclick="saveC()">Guardar</button>'+(ec?'<button class="btn x" onclick="delC()">Apagar categoria</button>':'')+'<button class="btn s" style="margin-top:6px" onclick="closeF()">Cancelar</button>'}
function kc(){dc.n=$("kn").value;dc.e=$("ke").value;if($("kl"))dc.l=$("kl").value}
function swc(x){kc();dc.t=x;if(x==="r")dc.l="";fc()}
function saveC(){kc();var n=dc.n.trim();if(!n){$("er").textContent="Escreve um nome.";return}
var l=parseFloat(dc.l),o={t:dc.t,n:n,e:dc.e.trim()||"🏷️",l:dc.t==="d"&&l>0?l:0};
if(ec)Object.assign(ec,o);else{o.id=uid();S.cats.push(o)}save();closeF();render()}
function delC(){var c=ec;ask('Apagar a categoria “'+esc(c.n)+'”? Os movimentos dela ficam sem categoria.',function(){S.cats=S.cats.filter(function(x){return x!==c});save();closeF();render()})}

$("fab").onclick=function(){openF()};
$("ov").onclick=function(e){if(e.target===$("ov"))closeF()};
load();render();
</script>
</body>
</html>
