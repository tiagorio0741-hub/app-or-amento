<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento do mês</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef2f7;--surf:#fff;--ink:#14213d;--mute:#5d6b85;--line:#d5dce8;--acc:#7a04db;--acc-ink:#fff;--ok:#1a7f5a;--bad:#c0392b;--track:#e1e7f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surf:#16223a;--ink:#e8eefb;--mute:#93a3c2;--line:#2a3a5c;--acc:#6b9bf0;--acc-ink:#0e1626;--ok:#4cc79a;--bad:#ff8577;--track:#24334f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1626;--surf:#16223a;--ink:#e8eefb;--mute:#93a3c2;--line:#2a3a5c;--acc:#30152d;--acc-ink:#0e1626;--ok:#4cc79a;--bad:#ff8577;--track:#24334f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1,h2,.big{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0}
h1{font-size:15px;font-weight:500;color:var(--mute)}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 12px}
.big.neg{color:var(--bad)}
h2{font-size:18px;font-weight:700;margin:28px 0 10px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar.over i{background:var(--bad)}
.duo{display:flex;justify-content:space-between;margin-top:10px;font-size:14px;color:var(--mute)}
.duo b{display:block;font-size:18px;color:var(--ink);font-weight:600}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg label{flex:1;text-align:center;padding:9px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:var(--acc)}
.seg label:has(input:checked){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.seg label:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
input[type=number],input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{width:100%;font:600 16px Figtree,system-ui,sans-serif;background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:12px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 84px;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .bar{grid-column:1/3}
.row input{margin:0;padding:6px 8px;text-align:right}
.row small{color:var(--mute)}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx div{flex:1;min-width:0}
.tx p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--mute)}
.pos{color:var(--ok);font-weight:600}
.del{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);margin:0;padding:6px 0}
</style>
</head>
<body>
<main>
<h1 id="mes"></h1>
<div class="big" id="saldo"></div>
<div class="bar" id="gbar"><i></i></div>
<div class="duo"><span>Receitas<b id="inc"></b></span><span style="text-align:right">Despesas<b id="exp"></b></span></div>

<h2>registrar movimento</h2>
<div class="panel">
<div class="seg">
<label><input type="radio" name="t" value="d" checked><span>Despesa</span></label>
<label><input type="radio" name="t" value="r"><span>Receita</span></label>
</div>
<input id="val" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Valor em euros" aria-label="Valor em euros">
<select id="cat" aria-label="Categoria"></select>
<input id="desc" type="text" placeholder="Descrição (opcional)" aria-label="Descrição">
<button class="btn" id="add">Adicionar</button>
</div>

<h2>Limites por categoria</h2>
<div class="panel" id="budgets"></div>

<h2>Movimentos do mês</h2>
<div class="panel" id="list"></div>
</main>         
<script>
var CATS=["Habitação","Alimentação","Transportes","Educação","Saúde","Lazer","Outros"];
var S=load();
function load(){try{var s=JSON.parse(localStorage.getItem("orc"));if(s&&s.tx)return s}catch(e){}return{tx:[],b:{}}}
function save(){try{localStorage.setItem("orc",JSON.stringify(S))}catch(e){}}
var d=new Date(),MK=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
var fmt=new Intl.NumberFormat("pt-PT",{style:"currency",currency:"EUR"});
function $(i){return document.getElementById(i)}
function type(){return document.querySelector("input[name=t]:checked").value}
$("mes").textContent=new Intl.DateTimeFormat("pt-PT",{month:"long",year:"numeric"}).format(d);
$("cat").innerHTML=CATS.map(function(c){return"<option>"+c+"</option>"}).join("");
document.querySelectorAll("input[name=t]").forEach(function(r){r.onchange=function(){$("cat").style.display=type()=="d"?"":"none"}});
$("add").onclick=function(){
  var v=parseFloat($("val").value);
  if(!(v>0)){$("val").focus();return}
  S.tx.push({id:Date.now(),m:MK,day:d.getDate(),t:type(),v:v,c:type()=="d"?$("cat").value:"Receita",n:$("desc").value.trim()});
  $("val").value="";$("desc").value="";save();render();
};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function render(){
  var tx=S.tx.filter(function(x){return x.m==MK}),inc=0,exp=0,by={};
  tx.forEach(function(x){if(x.t=="r")inc+=x.v;else{exp+=x.v;by[x.c]=(by[x.c]||0)+x.v}});
  var bal=inc-exp;
  $("saldo").textContent=fmt.format(bal);$("saldo").className="big"+(bal<0?" neg":"");
  $("inc").textContent=fmt.format(inc);$("exp").textContent=fmt.format(exp);
  var g=$("gbar");g.className="bar"+(exp>inc?" over":"");g.firstChild.style.width=Math.min(100,inc?exp/inc*100:(exp?100:0))+"%";
  var b=$("budgets");b.textContent="";
  CATS.forEach(function(c){
    var lim=S.b[c]||0,sp=by[c]||0,row=el("div","row"),l=el("div");
    l.appendChild(el("b",null,c));l.appendChild(el("br"));
    l.appendChild(el("small",null,fmt.format(sp)+(lim?" de "+fmt.format(lim):" gastos")));
    var inp=el("input");inp.type="number";inp.min="0";inp.inputMode="decimal";inp.placeholder="Limite";inp.value=lim||"";inp.setAttribute("aria-label","Limite de "+c);
    inp.onchange=function(){S.b[c]=parseFloat(inp.value)||0;save();render()};
    var bar=el("div","bar"+(lim&&sp>lim?" over":"")),i=el("i");i.style.width=(lim?Math.min(100,sp/lim*100):0)+"%";bar.appendChild(i);
    row.appendChild(l);row.appendChild(inp);row.appendChild(bar);b.appendChild(row);
  });
  var L=$("list");L.textContent="";
  if(!tx.length){L.appendChild(el("p","empty","Ainda não há movimentos. Adicione a primeira despesa ou receita."))}
  tx.slice().sort(function(a,b){return b.id-a.id}).forEach(function(x){
    var r=el("div","tx"),m=el("div");
    m.appendChild(el("p",null,x.n||x.c));m.appendChild(el("small",null,x.c+", dia "+x.day));
    var a=el("span",x.t=="r"?"pos":null,(x.t=="r"?"+":"−")+fmt.format(x.v));
    var del=el("button","del","×");del.setAttribute("aria-label","Apagar movimento");
    del.onclick=function(){S.tx=S.tx.filter(function(y){return y.id!=x.id});save();render()};
    r.appendChild(m);r.appendChild(a);r.appendChild(del);L.appendChild(r);
  });
}
render();
</script>
</body>
</html>
